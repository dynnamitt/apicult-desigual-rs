<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 510" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Target flow: settings, chunk coord, chunk_radius and the consumer's overrides build a layout through for_chunk (or new for a bounded grid). Cell state (height, radius) is the truth. Own cells, own tris, entangled seam tris and counts, and the delta are derived one way from it; entangled_seam_keys needs only chunk_radius. serialize, wasm.rs and the apicult-ffi C ABI shim export them. The consumer keeps edits and passes them back as overrides on every call.">
