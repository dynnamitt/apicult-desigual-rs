<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>welded hex terrain</title>
<style>
  body { margin: 0; background: #050810; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: monospace; color: #aaa; }
  h1 { margin: 1.5rem 0 0.25rem; font-size: 1.2rem; font-weight: normal; }
  .meta { font-size: 0.8rem; color: #666; margin-bottom: 1rem; }
  .meta a { color: #6a8; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin: 0 0 0.6rem; }
  .controls button {
    background: #1a2030; color: #9bd; border: 1px solid #2a3550;
    padding: 0.5rem 0.9rem; font-family: monospace; font-size: 0.85rem;
    border-radius: 4px; cursor: pointer; min-width: 44px; min-height: 44px;
  }
  .controls button.on { background: #2d4470; border-color: #4a6fb0; color: #cde; }
  .controls button:hover, .controls button:focus { background: #243250; outline: none; }
  .controls button:active { background: #324570; }
  .stats { font-size: 0.75rem; color: #667; margin: 0 0 0.6rem; }
  .stage { width: min(95vw, 1100px); }
  #stage { display: block; width: 100%; height: min(70vh, 600px); background: #0a0e1a; border-radius: 4px; }
  .hint { font-size: 0.75rem; color: #556; margin: 0.4rem 0 1.5rem; text-align: center; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <h1>welded hex terrain &mdash; one mesh, vec3-deduped</h1>
  <p class="meta">generated from <a href="https://github.com/dynnamitt/apicult-desigual-rs">dynnamitt/apicult-desigual-rs</a> &mdash; <span id="sha">__SHA__</span> &middot; <a href="svg-preview.html">grid preview</a></p>

  <div class="controls">
    <button id="btn-fill" type="button" class="on">filled</button>
    <button id="btn-wire" type="button" class="on">wireframe</button>
    <button id="btn-flat" type="button" class="on">flat shading</button>
  </div>
  <p class="stats" id="stats">loading…</p>
  <div class="stage"><canvas id="stage"></canvas></div>
  <p class="hint">drag to orbit &middot; scroll to zoom &middot; right-drag to pan</p>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { weldedMesh, vertexCount, triangleCount } from './hex-terrain.js';

const canvas = document.getElementById('stage');
const stats = document.getElementById('stats');

const showError = (msg) => {
  canvas.insertAdjacentHTML('afterend',
    `<p style="color:#f77;text-align:center;padding:0.6rem">${msg}</p>`);
};

const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const medianEdgeLength = (tris) => {
  const lens = [];
  for (const [a, b, c] of tris) lens.push(dist(a, b), dist(b, c), dist(c, a));
  lens.sort((x, y) => x - y);
  return lens[lens.length >> 1];
};

try {
  const payloads = [];
  for (let i = 1; i <= 16; i++) {
    const name = `apicult-${String(i).padStart(2, '0')}.json`;
    const res = await fetch(name);
    if (!res.ok) break;
    const payload = await res.json();
    if (payload.version !== 2 || !Array.isArray(payload.tris)) {
      throw new Error(`${name} is not a v2 payload — rebuild via \`make preview\``);
    }
    payloads.push({ index: i, tris: payload.tris });
  }
  if (payloads.length === 0) {
    throw new Error('no apicult-NN.json files found (start with apicult-01.json)');
  }

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e1a);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);

  const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 500);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(15, 25, 10);
  scene.add(sun);

  const state = {
    fill: true,
    wire: true,
    flat: true,
  };

  let meshes = [];
  let wireOverlays = [];

  const dispose = (obj) => {
    if (!obj) return;
    scene.remove(obj);
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) obj.material.dispose();
  };

  for (const p of payloads) {
    p.geom = weldedMesh([], p.tris);
    p.bbox = p.geom.boundingBox;
    p.medianEdge = medianEdgeLength(p.tris);
  }

  const gap = payloads.reduce((s, p) => s + p.medianEdge, 0) / payloads.length;
  let cursor = 0;
  for (const p of payloads) {
    const width = p.bbox.max.x - p.bbox.min.x;
    p.offsetX = cursor - p.bbox.min.x;
    cursor += width + gap;
  }
  const totalSpan = cursor - gap;
  const recenter = -totalSpan / 2;
  for (const p of payloads) p.offsetX += recenter;

  const rebuild = () => {
    meshes.forEach(dispose); meshes = [];
    wireOverlays.forEach(dispose); wireOverlays = [];

    for (const p of payloads) {
      const mat = new THREE.MeshStandardMaterial({
        color: 0x6c9,
        flatShading: state.flat,
        side: THREE.DoubleSide,
        roughness: 0.85,
        metalness: 0.05,
        wireframe: false,
        visible: state.fill,
      });
      const m = new THREE.Mesh(p.geom, mat);
      m.position.x = p.offsetX;
      scene.add(m);
      meshes.push(m);

      if (state.wire) {
        const wireGeom = new THREE.WireframeGeometry(p.geom);
        const w = new THREE.LineSegments(wireGeom, new THREE.LineBasicMaterial({
          color: 0xffee44, transparent: true, opacity: 0.5,
        }));
        w.position.x = p.offsetX;
        scene.add(w);
        wireOverlays.push(w);
      }
    }

    const totalVerts = payloads.reduce((s, p) => s + vertexCount(p.geom), 0);
    const totalTris = payloads.reduce((s, p) => s + triangleCount(p.geom), 0);
    const sourceTris = payloads.reduce((s, p) => s + p.tris.length, 0);
    stats.textContent =
      `meshes: ${payloads.length} · welded vertices: ${totalVerts} · ` +
      `triangles: ${totalTris} · source tris: ${sourceTris}`;
  };

  const wire = (id, key) => {
    const btn = document.getElementById(id);
    btn.addEventListener('click', () => {
      state[key] = !state[key];
      btn.classList.toggle('on', state[key]);
      rebuild();
    });
  };
  wire('btn-fill', 'fill');
  wire('btn-wire', 'wire');
  wire('btn-flat', 'flat');

  rebuild();

  const combined = new THREE.Box3();
  for (const p of payloads) {
    const worldBB = p.bbox.clone().translate(new THREE.Vector3(p.offsetX, 0, 0));
    combined.union(worldBB);
  }
  const target = combined.getCenter(new THREE.Vector3());
  const span = combined.getSize(new THREE.Vector3()).length();
  camera.position.set(target.x + span * 0.7, target.y + span * 0.5, target.z + span * 0.7);

  const controls = new OrbitControls(camera, canvas);
  controls.target.copy(target);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  function animate() {
    requestAnimationFrame(animate);
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (canvas.width !== w || canvas.height !== h) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
} catch (e) {
  console.error(e);
  showError(`terrain load failed: ${e.message}`);
}
</script>
</body>
</html>
