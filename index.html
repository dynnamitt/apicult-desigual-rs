<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>welded hex terrain — apicult-desigual</title>
<link rel="stylesheet" href="hex-terrain.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <header class="topbar">
    <h1><span class="accent">apicult-desigual</span> &middot; welded hex terrain</h1>
    <p class="meta">
      <a href="https://github.com/dynnamitt/apicult-desigual-rs">dynnamitt/apicult-desigual-rs</a>
      <span class="sep">/</span>
      <span id="sha">d259fd2</span>
      <span class="sep">/</span>
      <a href="svg-preview.html">grid preview</a>
    </p>
  </header>

  <main>
    <div class="stage-wrap">
      <canvas id="stage"></canvas>
      <p class="stats" id="stats">loading…</p>
    </div>

    <aside class="controls" aria-label="terrain controls">
      <fieldset>
        <legend>grid</legend>
        <label class="row"><span>radius</span>
          <input id="ctl-radius" type="number" min="1" max="8" step="1" value="2">
        </label>
        <label class="row"><span>seed</span>
          <input id="ctl-seed" type="text" inputmode="numeric" placeholder="random">
        </label>
        <label class="row"><span>nominal hex radius</span>
          <input id="ctl-nominal-hex-radius" type="number" min="1" max="20" step="0.5" value="4">
        </label>
        <label class="row"><span>petal distance</span>
          <input id="ctl-petal-distance" type="number" min="1.5" max="6" step="0.1" value="3">
        </label>
        <div class="button-row">
          <button id="btn-apply" type="button" class="primary">apply</button>
          <button id="btn-regen" type="button">re-roll</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>mesh</legend>
        <div class="toggle-grid">
          <button id="btn-fill" type="button" class="on">filled</button>
          <button id="btn-flat" type="button" class="on">flat shading</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>wires</legend>
        <div class="toggle-grid">
          <button id="btn-wire" type="button" class="on">wireframe</button>
        </div>
        <label class="row"><span>line width</span>
          <input id="ctl-line-width" type="number" min="1" max="6" step="0.5" value="2">
        </label>
        <label class="row"><span>dash speed</span>
          <input id="ctl-dash-speed" type="number" min="0" max="3" step="0.05" value="0.6">
        </label>
      </fieldset>

      <fieldset>
        <legend>shaders</legend>
        <div class="toggle-grid">
          <button id="btn-shader" type="button">glowy hexes</button>
          <button id="btn-bands"  type="button">ringed-entities</button>
          <button id="btn-bridge" type="button">bridge</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>post-fx</legend>
        <label class="row"><span>bloom strength</span>
          <input id="ctl-bloom-strength" type="number" min="0" max="3" step="0.05" value="0.8">
        </label>
        <label class="row"><span>bloom radius</span>
          <input id="ctl-bloom-radius" type="number" min="0" max="2" step="0.05" value="0.5">
        </label>
        <label class="row"><span>bloom threshold</span>
          <input id="ctl-bloom-threshold" type="number" min="0" max="1.5" step="0.05" value="0.75">
        </label>
      </fieldset>
    </aside>
  </main>

  <p class="hint">
    drag to orbit
    <span class="sep">·</span>
    scroll to zoom
    <span class="sep">·</span>
    right-drag to pan
  </p>

<script type="module">
import init, { WasmLayout } from './pkg/apicult_desigual.js';
import { mount } from './hex-terrain-scene.js';
import { bindControls, readSettingsFromDOM } from './hex-terrain-controls.js';

await init();

const stageEl    = document.getElementById('stage');
const statsEl    = document.getElementById('stats');
const controlsEl = document.querySelector('.controls');

const initialSettings = readSettingsFromDOM(controlsEl);
const api = mount(stageEl, statsEl, { initialSettings, WasmLayout });

bindControls(controlsEl, {
  initialSettings,
  onApply:  (s) => api.regenerate(s),
  onLive:   (s) => api.updateLive(s),
  onToggle: (k, on) => api.setToggle(k, on),
});
</script>
</body>
</html>
